name: JugaaduToons Hindi Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12,17 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Hindi cartoon Short
        run: python generate_jugaadu_short.py
      - name: Save video and metadata
        uses: actions/upload-artifact@v4
        with:
          name: jugaadu-short-${{ github.run_number }}
          path: jugaadu_output/
          if-no-files-found: error
          retention-days: 7
      - name: Optional YouTube upload (private for review)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            python upload_jugaadu_youtube.py
          else
            echo "YouTube OAuth secrets incomplete; video saved as artifact only."
          fi
